baseURL = 'https://vso.thgnetworks.com/'
languageCode = 'en-us'
title = 'VSO'

enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]
enableGitInfo = false
summaryLength = 40

[frontmatter]
  lastmod = ['last_updated', ':fileModTime']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  description = "Variable star observing: the T Coronae Borealis (Blaze Star) nova watch with live AAVSO data, and a sourced Seestar variable-star photometry manual."
  author = "Aaron Henderson"

[taxonomies]
  tag = "tags"
  category = "categories"

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "Blaze Star Watch"
    url = "/t-crb/"
    weight = 2
  [[menu.main]]
    name = "Seestar VSO Manual"
    url = "/seestar-vso-manual/"
    weight = 3
