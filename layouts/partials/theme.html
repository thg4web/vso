{{/* Light/dark switch for the plain pages. Dark by default; the choice is saved in the browser under the
     same key the T CrB page uses, so it follows the visitor between pages. */}}
<script>
(function () {
  var t = 'dark';
  try { if (localStorage.getItem('tcrb-theme') === 'light') t = 'light'; } catch (e) {}
  document.body.setAttribute('data-theme', t);
})();
</script>
<div class="bg-photo"></div>
<canvas id="sky" aria-hidden="true"></canvas>
<button class="site-theme-toggle" id="site-theme-toggle" type="button" aria-pressed="false">
  <span id="site-theme-icon" aria-hidden="true">&#9728;&#65039;</span>
  <span id="site-theme-label">Light mode</span>
</button>
<script>
(function () {
  var btn = document.getElementById('site-theme-toggle');
  var icon = document.getElementById('site-theme-icon');
  var label = document.getElementById('site-theme-label');
  function apply(theme) {
    document.body.setAttribute('data-theme', theme);
    btn.setAttribute('aria-pressed', theme === 'light' ? 'true' : 'false');
    icon.textContent = theme === 'light' ? '\uD83C\uDF19' : '\u2600\uFE0F';
    label.textContent = theme === 'light' ? 'Dark mode' : 'Light mode';
    try { localStorage.setItem('tcrb-theme', theme); } catch (e) {}
  }
  btn.addEventListener('click', function () {
    apply(document.body.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
  });
  apply(document.body.getAttribute('data-theme') === 'light' ? 'light' : 'dark');
})();
</script>
<script>
// Twinkling starfield, as on astro.thgnetworks.com. Stars invert to dark points on the light theme.
(function () {
  var canvas = document.getElementById('sky');
  if (!canvas || !canvas.getContext) return;
  var ctx = canvas.getContext('2d'), reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var dpr = Math.min(window.devicePixelRatio || 1, 2), w = 0, h = 0, stars = [];
  function isLight() { return document.body.getAttribute('data-theme') === 'light'; }
  function build() {
    stars.length = 0;
    var n = Math.max(120, Math.min(Math.round((w * h) / 6400), 320));
    for (var i = 0; i < n; i++) {
      stars.push({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.25 + 0.25, a: Math.random() * 0.55 + 0.28,
                   sp: Math.random() * 3200 + 2400, off: Math.random() * Math.PI * 2, tint: Math.random() < 0.18 });
    }
  }
  function draw(t) {
    var light = isLight();
    ctx.clearRect(0, 0, w, h);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i], pulse = reduce ? 0.78 : (0.5 + 0.5 * Math.sin(t / s.sp + s.off));
      var alpha = (s.a * (0.42 + 0.58 * pulse)).toFixed(3);
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = light ? (s.tint ? 'rgba(30,64,110,' + alpha + ')' : 'rgba(22,28,42,' + alpha + ')')
                            : (s.tint ? 'rgba(150,190,235,' + alpha + ')' : 'rgba(255,255,255,' + alpha + ')');
      ctx.fill();
    }
  }
  function resize() {
    w = canvas.clientWidth || window.innerWidth; h = canvas.clientHeight || window.innerHeight;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); build(); draw(0);
  }
  function loop(t) { draw(t); requestAnimationFrame(loop); }
  var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(resize, 150); });
  resize();
  if (!reduce) requestAnimationFrame(loop);
})();
</script>
